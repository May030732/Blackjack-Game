<!-- Client-side Interactive JavaScript for Actions & Modals -->
<script>
    function toggleModal(modalId) {
      const modal = document.getElementById(modalId);
      if (!modal) return;
      if (modal.classList.contains('hidden')) {
        modal.classList.remove('hidden');
        setTimeout(() => {
          modal.classList.remove('opacity-0');
        }, 10);
      } else {
        modal.classList.add('opacity-0');
        setTimeout(() => {
          modal.classList.add('hidden');
        }, 200);
      }
    }

    function handleAction(type) {
      const hitBtn = document.getElementById('btn-hit');
      const standBtn = document.getElementById('btn-stand');
      const playerHand = document.getElementById('player-hand');
      const scoreEl = document.getElementById('player-score');

      if (type === 'hit') {
        // Dynamic Hit demonstration card addition (e.g. 2 of Clubs)
        if (playerHand.children.length === 2) {
          const newCard = document.createElement('div');
          newCard.className = "relative w-[100px] h-[142px] sm:w-[122px] sm:h-[174px] bg-[#FCFAF2] rounded-[14px] p-2 flex flex-col justify-between select-none shadow-[0_12px_24px_rgba(0,0,0,0.55),0_3px_6px_rgba(0,0,0,0.3)] transform -translate-y-4 opacity-0 transition-all duration-300";
          newCard.innerHTML = `
            <div class="flex flex-col items-center leading-none text-[#1C1E21] self-start">
              <span class="font-headline-sm text-[20px] sm:text-[24px] font-bold">2</span>
              <span class="text-[14px] sm:text-[16px] leading-tight">♣</span>
            </div>
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-[#1C1E21]">
              <span class="text-[44px] sm:text-[54px] leading-none filter drop-shadow-sm">♣</span>
              <div class="w-8 sm:w-10 h-0.5 bg-[#1C1E21]/20 mt-1 rounded-full"></div>
            </div>
            <div class="flex flex-col items-center leading-none text-[#1C1E21] self-end rotate-180">
              <span class="font-headline-sm text-[20px] sm:text-[24px] font-bold">2</span>
              <span class="text-[14px] sm:text-[16px] leading-tight">♣</span>
            </div>
          `;
          playerHand.appendChild(newCard);
          setTimeout(() => {
            newCard.classList.remove('-translate-y-4', 'opacity-0');
            scoreEl.textContent = '21';
            scoreEl.classList.add('animate-pulse');
          }, 50);
        }
      } else if (type === 'stand') {
        hitBtn.disabled = true;
        hitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        standBtn.disabled = true;
        standBtn.classList.add('opacity-50', 'cursor-not-allowed');
      }
    }
  </script>
